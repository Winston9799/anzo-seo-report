<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANZO Capital — SEO Reports</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --red: #B22333; --red-light: #FAE8EA;
  --amber: #B26D23; --amber-light: #F5E9D8;
  --green: #1E6E3E; --green-light: #E8F5EE;
  --alt: #F4F4F4; --border: #DEDEDE;
  --text: #1A1A1A; --muted: #666;
  --bg: #F2F3F5; --white: #fff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}

/* ── NAV ── */
nav{background:var(--white);border-bottom:1px solid var(--border);padding:0 28px;position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:0}
.nav-brand{font-weight:800;font-size:15px;color:var(--red);padding:13px 0;margin-right:24px;white-space:nowrap;letter-spacing:-0.3px}
.nav-brand span{color:var(--text);font-weight:400}
nav a.nav-link{color:var(--muted);text-decoration:none;padding:13px 10px;font-size:13px;white-space:nowrap;border-bottom:2px solid transparent;transition:.15s}
nav a.nav-link:hover{color:var(--red);border-bottom-color:var(--red)}

/* ── FILTER BAR ── */
.filter-bar{background:var(--white);border-bottom:1px solid var(--border);padding:10px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:47px;z-index:190}
.filter-group{display:flex;align-items:center;gap:6px}
.filter-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);white-space:nowrap}
.chip-row{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:var(--white);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.chip:hover{border-color:var(--red);color:var(--red)}
.chip.active{background:var(--red);color:#fff;border-color:var(--red)}
.chip.disabled{opacity:.35;cursor:default;pointer-events:none}
.filter-divider{width:1px;height:20px;background:var(--border)}

/* ── REPORT PICKER (empty state) ── */
#report-picker{max-width:860px;margin:32px auto;padding:0 20px}
.picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:16px}
.picker-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:16px 18px;cursor:pointer;transition:.15s;border-top:3px solid var(--border)}
.picker-card:hover{border-top-color:var(--red);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.picker-card-type{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:4px}
.picker-card-label{font-size:16px;font-weight:700}
.picker-card-meta{font-size:12px;color:var(--muted);margin-top:2px}
.no-reports{text-align:center;padding:60px 20px;color:var(--muted)}

/* ── PAGE ── */
#report-view{display:none}
.page{max-width:1140px;margin:0 auto;padding:24px 20px 60px}

/* ── REPORT HEADER ── */
.report-header{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:20px 24px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.rh-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:4px}
.rh-title{font-size:22px;font-weight:800} .rh-title span{color:var(--red)}
.rh-meta{font-size:12px;color:var(--muted);margin-top:3px}
.rh-badge{display:inline-flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.badge-pill{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
.bp-type-monthly{background:#EBF0FF;color:#2255CC}
.bp-type-weekly{background:#E8F5EE;color:var(--green)}
.bp-type-quarterly{background:var(--amber-light);color:var(--amber)}
.bp-type-yearly{background:var(--red-light);color:var(--red)}
.rh-logo{font-size:30px;font-weight:900;color:var(--red);letter-spacing:-2px;white-space:nowrap}
.rh-logo span{color:var(--amber)}

/* ── SECTION ── */
.sec{margin-top:32px}
.sec-hd{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sec-num{font-size:11px;font-weight:700;color:var(--red);background:var(--red-light);padding:2px 7px;border-radius:4px;letter-spacing:.4px}
.sec-title{font-size:18px;font-weight:700}
.sec-sub{color:var(--muted);font-size:12px}
.sub-hd{font-size:14px;font-weight:700;margin:18px 0 8px;color:var(--text)}

/* ── CARDS ── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:16px 18px;border-top:3px solid var(--red)}
.card-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:4px}
.card-value{font-size:26px;font-weight:700;color:var(--red);line-height:1.1}
.card-delta{font-size:12px;margin-top:4px;font-weight:600}
.card-sub{font-size:11px;color:var(--muted);margin-top:2px}
.up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--muted)}

.dual-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.dual-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:14px 18px}
.dual-card.branded{border-top:3px solid var(--red)} .dual-card.nonbranded{border-top:3px solid var(--amber)}
.dual-card h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.dual-card.branded h3{color:var(--red)} .dual-card.nonbranded h3{color:var(--amber)}
.dual-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border);font-size:13px}
.dual-row:last-child{border-bottom:none} .dual-val{font-weight:600}

.wc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.wc-box{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:14px 18px}
.wc-box.wins{border-top:3px solid var(--green)} .wc-box.concerns{border-top:3px solid var(--red)}
.wc-box h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.wc-box.wins h3{color:var(--green)} .wc-box.concerns h3{color:var(--red)}
.wc-box ul{padding-left:16px} .wc-box li{font-size:13px;margin-bottom:5px;line-height:1.5}

/* ── TABLES ── */
.tbl-wrap{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--white)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--red);color:#fff;padding:8px 11px;text-align:left;font-weight:600;font-size:12px;white-space:nowrap}
th.r,td.r{text-align:right}
tbody tr:nth-child(even){background:var(--alt)}
tbody tr:hover{background:#EEF2FF}
tbody td{padding:7px 11px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
td.url-cell{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-family:monospace}
.td-up{color:var(--green);font-weight:600} .td-dn{color:var(--red);font-weight:600} .td-fl{color:var(--muted)}
tr.p1 td:first-child{border-left:3px solid #C0392B}
tr.p2 td:first-child{border-left:3px solid var(--amber)}
tr.p3 td:first-child{border-left:3px solid #2980B9}

/* ── BADGES ── */
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700}
.b-poor{background:#FDECEC;color:#C0392B} .b-needs{background:var(--amber-light);color:var(--amber)} .b-good{background:var(--green-light);color:var(--green)}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:700}
.p-urgent{background:#FDECEC;color:#C0392B} .p-high{background:var(--red-light);color:var(--red)} .p-medium{background:var(--amber-light);color:var(--amber)} .p-low{background:var(--green-light);color:var(--green)}

/* ── TABS ── */
.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:14px}
.tab-btn{padding:7px 16px;background:none;border:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:.15s}
.tab-btn.active{color:var(--red);border-bottom-color:var(--red)}
.tab-pane{display:none} .tab-pane.active{display:block}

/* ── CWV ── */
.cwv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.cwv-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.cwv-metric{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:5px}
.cwv-val{font-size:24px;font-weight:700;margin-bottom:3px}
.cwv-val.poor{color:#C0392B} .cwv-val.needs{color:var(--amber)} .cwv-val.good{color:var(--green)}
.dist-bar{height:9px;border-radius:5px;display:flex;overflow:hidden;margin-top:9px}
.dg{background:#27AE60} .dn{background:#F39C12} .dp{background:#C0392B}
.dist-leg{display:flex;gap:10px;margin-top:5px;font-size:11px;color:var(--muted)}
.dist-leg .lg{color:#27AE60} .dist-leg .ln{color:#F39C12} .dist-leg .lp{color:#C0392B}
.cwv-note{font-size:11px;color:var(--muted);margin-top:7px}

/* ── CHARTS ── */
.chart-wrap{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:18px;margin-top:12px}
.chart-title{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px}
canvas{max-height:240px}

/* ── LAYOUT ── */
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.mt12{margin-top:12px} .mt20{margin-top:20px}

/* ── FOOTER ── */
.report-footer{margin-top:36px;padding:14px;background:var(--white);border:1px solid var(--border);border-radius:10px;font-size:12px;color:var(--muted);text-align:center}

@media(max-width:900px){
  .kpi-grid,.cwv-grid{grid-template-columns:repeat(2,1fr)}
  .row-2,.dual-grid,.wc-grid{grid-template-columns:1fr}
  .filter-bar{top:47px}
}
@media(max-width:600px){
  .kpi-grid{grid-template-columns:1fr 1fr}
  nav a.nav-link{display:none}
}
</style>
</head>
<body>

<!-- ─── NAV ──────────────────────────────────────────────────────── -->
<nav>
  <div class="nav-brand">ANZO <span>SEO Reports</span></div>
  <a href="#exec"         class="nav-link">Summary</a>
  <a href="#performance"  class="nav-link">Performance</a>
  <a href="#cwv"          class="nav-link">Core Web Vitals</a>
  <a href="#coverage"     class="nav-link">Coverage</a>
  <a href="#opportunities" class="nav-link">Opportunities</a>
  <a href="#actions"      class="nav-link">Actions</a>
</nav>

<!-- ─── FILTER BAR ──────────────────────────────────────────────── -->
<div class="filter-bar">
  <div class="filter-group">
    <span class="filter-label">Type</span>
    <div class="chip-row" id="type-chips"></div>
  </div>
  <div class="filter-divider"></div>
  <div class="filter-group">
    <span class="filter-label">Year</span>
    <div class="chip-row" id="year-chips"></div>
  </div>
  <div class="filter-divider"></div>
  <div class="filter-group">
    <span class="filter-label">Period</span>
    <div class="chip-row" id="period-chips"></div>
  </div>
</div>

<!-- ─── REPORT PICKER ────────────────────────────────────────────── -->
<div id="report-picker">
  <div class="sub-hd" style="font-size:16px;margin:0 0 4px">Available Reports</div>
  <div style="font-size:13px;color:var(--muted);margin-bottom:14px">Select a report to view, or use the filters above.</div>
  <div class="picker-grid" id="picker-grid"></div>
</div>

<!-- ─── REPORT VIEW ───────────────────────────────────────────────── -->
<div id="report-view">
<div class="page" id="report-page"></div>
</div>

<script>
// ─── STATE ────────────────────────────────────────────────────────
let manifest = null;
let currentReport = null;
let activeType = 'all';
let activeYear = 'all';
let activePeriod = null;
let charts = {};

const TYPE_LABELS = { all:'All', weekly:'Weekly', monthly:'Monthly', quarterly:'Quarterly', yearly:'Yearly' };
const MONTH_NAMES = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const PRIORITY_CLASS = { urgent:'p-urgent', high:'p-high', medium:'p-medium', low:'p-low' };
const PRIORITY_ROW   = { urgent:'p1', high:'p1', medium:'p2', low:'p3' };

// ─── BOOT ─────────────────────────────────────────────────────────
async function boot() {
  try {
    const res = await fetch('reports/manifest.json');
    manifest = await res.json();
  } catch(e) {
    document.getElementById('report-picker').innerHTML =
      '<div class="no-reports">Could not load manifest.json. Ensure the file exists in the /reports folder.</div>';
    return;
  }
  buildFilters();
  buildPickerGrid(manifest.reports);
  // auto-load from URL hash or first report
  const hash = location.hash.replace('#','');
  const target = hash ? manifest.reports.find(r=>r.id===hash) : manifest.reports[manifest.reports.length-1];
  if (target) loadReport(target.id);
}

// ─── FILTERS ──────────────────────────────────────────────────────
function buildFilters() {
  const reports = manifest.reports;

  // Type chips
  const types = ['all', ...new Set(reports.map(r=>r.type))];
  document.getElementById('type-chips').innerHTML = types.map(t =>
    `<button class="chip ${t===activeType?'active':''}" onclick="setType('${t}')">${TYPE_LABELS[t]||t}</button>`
  ).join('');

  // Year chips
  const years = ['all', ...new Set(reports.map(r=>r.year)).values()].sort((a,b)=> a==='all'?-1:b-a);
  document.getElementById('year-chips').innerHTML = years.map(y =>
    `<button class="chip ${String(y)===String(activeYear)?'active':''}" onclick="setYear('${y}')">${y==='all'?'All':y}</button>`
  ).join('');

  buildPeriodChips();
}

function buildPeriodChips() {
  const reports = manifest.reports;
  const filtered = reports.filter(r =>
    (activeType === 'all' || r.type === activeType) &&
    (activeYear === 'all' || String(r.year) === String(activeYear))
  );

  let chips = '';
  if (filtered.length === 0) {
    chips = '<span style="font-size:12px;color:var(--muted)">No reports</span>';
  } else {
    chips = filtered.map(r => {
      const label = getPeriodLabel(r);
      const isActive = currentReport && currentReport.meta.id === r.id;
      return `<button class="chip ${isActive?'active':''}" onclick="loadReport('${r.id}')">${label}</button>`;
    }).join('');
  }
  document.getElementById('period-chips').innerHTML = chips;
}

function getPeriodLabel(r) {
  if (r.type === 'monthly') return MONTH_NAMES[r.month] || r.label;
  if (r.type === 'weekly')  return `W${String(r.week).padStart(2,'0')}`;
  if (r.type === 'quarterly') return `Q${r.quarter}`;
  if (r.type === 'yearly')  return String(r.year);
  return r.label;
}

function setType(t) { activeType = t; buildFilters(); buildPickerGrid(getFiltered()); }
function setYear(y) { activeYear = y; buildFilters(); buildPickerGrid(getFiltered()); }
function getFiltered() {
  return manifest.reports.filter(r =>
    (activeType==='all' || r.type===activeType) &&
    (activeYear==='all' || String(r.year)===String(activeYear))
  );
}

// ─── PICKER GRID ──────────────────────────────────────────────────
function buildPickerGrid(reports) {
  const grid = document.getElementById('picker-grid');
  if (!reports.length) {
    grid.innerHTML = '<div class="no-reports" style="grid-column:1/-1;padding:30px 0">No reports match the selected filters.</div>';
    return;
  }
  grid.innerHTML = reports.slice().reverse().map(r => `
    <div class="picker-card" onclick="loadReport('${r.id}')">
      <div class="picker-card-type">${TYPE_LABELS[r.type]||r.type}</div>
      <div class="picker-card-label">${r.label}</div>
      <div class="picker-card-meta">vs ${r.comparePeriod || '—'} · ${r.generatedAt}</div>
    </div>
  `).join('');
}

// ─── LOAD REPORT ──────────────────────────────────────────────────
async function loadReport(id) {
  const entry = manifest.reports.find(r => r.id === id);
  if (!entry) return;
  let data;
  try {
    const res = await fetch(entry.file);
    data = await res.json();
  } catch(e) {
    alert('Could not load report data: ' + entry.file); return;
  }
  currentReport = data;
  history.replaceState(null,'','#'+id);
  destroyCharts();
  renderReport(data);
  document.getElementById('report-picker').style.display = 'none';
  document.getElementById('report-view').style.display = 'block';
  buildPeriodChips();
  window.scrollTo({top:0,behavior:'smooth'});
}

function destroyCharts() {
  Object.values(charts).forEach(c => c.destroy());
  charts = {};
}

// ─── HELPERS ──────────────────────────────────────────────────────
const fmt  = n => n == null ? '—' : Number(n).toLocaleString();
const fmtK = n => n >= 1000 ? (n/1000).toFixed(1).replace(/\.0$/,'')+'K' : fmt(n);
const pct  = n => n == null ? '—' : n.toFixed(1)+'%';
const pos  = n => n == null ? '—' : Number(n).toFixed(1);

function delta(cur, prev, higherIsBetter=true) {
  if (prev == null || prev === 0) return '<span class="td-fl">—</span>';
  const d = cur - prev;
  const p = ((d / Math.abs(prev)) * 100).toFixed(1);
  const isGood = higherIsBetter ? d > 0 : d < 0;
  const cls = d === 0 ? 'td-fl' : (isGood ? 'td-up' : 'td-dn');
  const sign = d > 0 ? '+' : '';
  return `<span class="${cls}">${sign}${fmt(d)} (${sign}${p}%)</span>`;
}

function deltaSimple(cur, prev, higherIsBetter=true) {
  if (prev == null) return '<span class="flat">—</span>';
  const d = cur - prev;
  const isGood = higherIsBetter ? d > 0 : d < 0;
  const cls = d === 0 ? 'flat' : (isGood ? 'up' : 'down');
  const sign = d > 0 ? '▲ +' : (d < 0 ? '▼ ' : '― ');
  return `<span class="card-delta ${cls}">${sign}${fmt(Math.abs(d))}</span>`;
}

function typeClass(type) {
  return { monthly:'bp-type-monthly', weekly:'bp-type-weekly', quarterly:'bp-type-quarterly', yearly:'bp-type-yearly' }[type] || '';
}

// ─── RENDER REPORT ────────────────────────────────────────────────
function renderReport(d) {
  const m = d.meta;
  const page = document.getElementById('report-page');
  page.innerHTML = `
    ${renderHeader(d)}
    ${renderExec(d)}
    ${renderPerformance(d)}
    ${renderCWV(d)}
    ${renderCoverage(d)}
    ${renderOpportunities(d)}
    ${renderActions(d)}
    <div class="report-footer">
      Report generated ${m.generatedAt} · Data source: Google Search Console ·
      Property: ${m.property} · ${m.searchType} search
    </div>
  `;
  // wire up tab buttons
  page.querySelectorAll('[data-tab-group]').forEach(btn => {
    btn.addEventListener('click', () => {
      const group = btn.dataset.tabGroup;
      const target = btn.dataset.tabTarget;
      document.querySelectorAll(`[data-tab-group="${group}"]`).forEach(b => b.classList.remove('active'));
      document.querySelectorAll(`[data-tab-pane="${group}"]`).forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.querySelector(`[data-tab-pane="${group}"][data-tab-id="${target}"]`).classList.add('active');
    });
  });
  // build charts after DOM is ready
  requestAnimationFrame(() => {
    buildDeviceChart(d);
    buildCoverageChart(d);
    buildRichResultsChart(d);
  });
}

// ─── HEADER ───────────────────────────────────────────────────────
function renderHeader(d) {
  const m = d.meta;
  return `
  <div class="report-header">
    <div>
      <div class="rh-label">SEO Performance Report</div>
      <div class="rh-title"><span>ANZO Capital</span> — ${m.period}</div>
      <div class="rh-meta">Reporting period: ${m.dateStart} → ${m.dateEnd} · Compared to: ${m.comparePeriod}</div>
      <div class="rh-badge">
        <span class="badge-pill ${typeClass(m.type)}">${TYPE_LABELS[m.type]||m.type}</span>
        <span class="badge-pill" style="background:var(--alt);color:var(--muted)">${m.searchType}</span>
        <span class="badge-pill" style="background:var(--alt);color:var(--muted)">Generated ${m.generatedAt}</span>
      </div>
    </div>
    <div class="rh-logo">ANZO<span>.</span></div>
  </div>`;
}

// ─── 01 EXECUTIVE SUMMARY ─────────────────────────────────────────
function renderExec(d) {
  const k = d.kpis;
  const b = d.branded, nb = d.nonBranded;
  return `
  <div class="sec" id="exec">
    <div class="sec-hd">
      <span class="sec-num">01</span>
      <span class="sec-title">Executive Summary</span>
      <span class="sec-sub">${d.meta.period} vs ${d.meta.comparePeriod}</span>
    </div>
    <div class="kpi-grid">
      <div class="card">
        <div class="card-label">Total Clicks</div>
        <div class="card-value">${fmtK(k.clicks.current)}</div>
        ${deltaSimple(k.clicks.current, k.clicks.previous)}
        <div class="card-sub">vs ${fmtK(k.clicks.previous)} prior period</div>
      </div>
      <div class="card">
        <div class="card-label">Total Impressions</div>
        <div class="card-value">${fmtK(k.impressions.current)}</div>
        ${deltaSimple(k.impressions.current, k.impressions.previous)}
        <div class="card-sub">vs ${fmtK(k.impressions.previous)} prior period</div>
      </div>
      <div class="card">
        <div class="card-label">Average CTR</div>
        <div class="card-value">${pct(k.ctr.current)}</div>
        ${deltaSimple(k.ctr.current, k.ctr.previous)}
        <div class="card-sub">vs ${pct(k.ctr.previous)} prior period</div>
      </div>
      <div class="card">
        <div class="card-label">Avg Position</div>
        <div class="card-value">${pos(k.position.current)}</div>
        ${deltaSimple(k.position.current, k.position.previous, false)}
        <div class="card-sub">vs ${pos(k.position.previous)} prior period</div>
      </div>
    </div>
    <div class="dual-grid">
      <div class="dual-card branded">
        <h3>Branded Traffic</h3>
        <div class="dual-row"><span>Clicks</span><span class="dual-val">${fmt(b.clicks.current)}</span></div>
        <div class="dual-row"><span>vs Prior</span><span class="dual-val">${fmt(b.clicks.previous)}</span></div>
        <div class="dual-row"><span>Impressions</span><span class="dual-val">${fmt(b.impressions.current)}</span></div>
        <div class="dual-row"><span>CTR</span><span class="dual-val">${pct(b.ctr)}</span></div>
        <div class="dual-row"><span>Share of Clicks</span><span class="dual-val">${pct(b.shareOfClicks)}</span></div>
      </div>
      <div class="dual-card nonbranded">
        <h3>Non-Branded Traffic</h3>
        <div class="dual-row"><span>Clicks</span><span class="dual-val">${fmt(nb.clicks.current)}</span></div>
        <div class="dual-row"><span>vs Prior</span><span class="dual-val">${fmt(nb.clicks.previous)}</span></div>
        <div class="dual-row"><span>Impressions</span><span class="dual-val">${fmt(nb.impressions.current)}</span></div>
        <div class="dual-row"><span>CTR</span><span class="dual-val">${pct(nb.ctr)}</span></div>
        <div class="dual-row"><span>Share of Clicks</span><span class="dual-val">${pct(nb.shareOfClicks)}</span></div>
      </div>
    </div>
    <div class="wc-grid">
      <div class="wc-box wins">
        <h3>✓ Wins This Period</h3>
        <ul>${d.wins.map(w=>`<li>${w}</li>`).join('')}</ul>
      </div>
      <div class="wc-box concerns">
        <h3>⚠ Concerns to Address</h3>
        <ul>${d.concerns.map(c=>`<li>${c}</li>`).join('')}</ul>
      </div>
    </div>
  </div>`;
}

// ─── 02 SEARCH PERFORMANCE ────────────────────────────────────────
function renderPerformance(d) {
  const k = d.kpis;
  const queryRows = d.queries.slice(0,10).map(q => {
    const dd = q.clicksPrev != null ? q.clicks - q.clicksPrev : null;
    const cls = dd == null ? 'td-fl' : dd > 0 ? 'td-up' : dd < 0 ? 'td-dn' : 'td-fl';
    const ddStr = dd == null ? '—' : (dd>0?'+':'')+dd;
    return `<tr>
      <td>${q.query}</td>
      <td class="r">${fmt(q.clicks)}</td>
      <td class="r">${fmt(q.clicksPrev??'—')}</td>
      <td class="r <span class="${cls}">${ddStr}</span></td>
      <td class="r">${fmt(q.impressions)}</td>
      <td class="r">${pct(q.ctr)}</td>
      <td class="r">${pos(q.position)}</td>
      <td class="r">${pos(q.positionPrev)}</td>
    </tr>`;
  }).join('');

  const pageRows = d.pages.map(p => {
    const dd = p.clicks - (p.clicksPrev||0);
    const cls = dd > 0 ? 'td-up' : dd < 0 ? 'td-dn' : 'td-fl';
    return `<tr>
      <td class="url-cell" title="${p.page}">${p.displayPage||p.page}</td>
      <td class="r">${fmt(p.clicks)}</td>
      <td class="r <span class="${cls}">${(dd>0?'+':'')+dd}</span></td>
      <td class="r">${fmt(p.impressions)}</td>
      <td class="r">${pct(p.ctr)}</td>
      <td class="r">${pos(p.position)}</td>
    </tr>`;
  }).join('');

  const countryRows = d.countries.map(c => {
    const dd = c.clicks - (c.clicksPrev||0);
    const cls = dd > 0 ? 'td-up' : dd < 0 ? 'td-dn' : 'td-fl';
    return `<tr>
      <td>${c.flag||''} ${c.country}</td>
      <td class="r">${fmt(c.clicks)}</td>
      <td class="r"><span class="${cls}">${(dd>0?'+':'')+dd}</span></td>
      <td class="r">${pct(c.ctr)}</td>
      <td class="r">${pos(c.position)}</td>
    </tr>`;
  }).join('');

  const deviceRows = d.devices.map(dv => {
    const dd = dv.clicks - (dv.clicksPrev||0);
    const cls = dd > 0 ? 'td-up' : dd < 0 ? 'td-dn' : 'td-fl';
    return `<tr>
      <td>${dv.icon||''} ${dv.device}</td>
      <td class="r">${fmt(dv.clicks)}</td>
      <td class="r"><span class="${cls}">${(dd>0?'+':'')+dd}</span></td>
      <td class="r">${pct(dv.ctr)}</td>
      <td class="r">${pos(dv.position)}</td>
    </tr>`;
  }).join('');

  return `
  <div class="sec" id="performance">
    <div class="sec-hd">
      <span class="sec-num">02</span>
      <span class="sec-title">Search Performance</span>
      <span class="sec-sub">Google Search Console · ${d.meta.searchType} · ${d.meta.period} vs ${d.meta.comparePeriod}</span>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Metric</th><th class="r">Current</th><th class="r">Previous</th><th class="r">Change</th><th class="r">% Change</th></tr></thead>
        <tbody>
          <tr><td>Total Clicks</td><td class="r">${fmt(k.clicks.current)}</td><td class="r">${fmt(k.clicks.previous)}</td><td class="r">${delta(k.clicks.current,k.clicks.previous)}</td><td class="r">${delta(k.clicks.current,k.clicks.previous)}</td></tr>
          <tr><td>Total Impressions</td><td class="r">${fmt(k.impressions.current)}</td><td class="r">${fmt(k.impressions.previous)}</td><td class="r" colspan="2">${delta(k.impressions.current,k.impressions.previous)}</td></tr>
          <tr><td>Average CTR</td><td class="r">${pct(k.ctr.current)}</td><td class="r">${pct(k.ctr.previous)}</td><td class="r" colspan="2">${delta(k.ctr.current,k.ctr.previous)}</td></tr>
          <tr><td>Average Position</td><td class="r">${pos(k.position.current)}</td><td class="r">${pos(k.position.previous)}</td><td class="r" colspan="2">${delta(k.position.current,k.position.previous,false)}</td></tr>
        </tbody>
      </table>
    </div>
    <div class="sub-hd">Top Keyword Movers</div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Query</th><th class="r">Clicks</th><th class="r">Prev</th><th class="r">Δ</th><th class="r">Impressions</th><th class="r">CTR</th><th class="r">Position</th><th class="r">Prev Pos</th></tr></thead>
        <tbody>${queryRows}</tbody>
      </table>
    </div>
    <div class="sub-hd">Top Pages by Clicks</div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Page</th><th class="r">Clicks</th><th class="r">Δ Clicks</th><th class="r">Impressions</th><th class="r">CTR</th><th class="r">Position</th></tr></thead>
        <tbody>${pageRows}</tbody>
      </table>
    </div>
    <div class="row-2">
      <div>
        <div class="sub-hd">Top Countries</div>
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>Country</th><th class="r">Clicks</th><th class="r">Δ</th><th class="r">CTR</th><th class="r">Position</th></tr></thead>
            <tbody>${countryRows}</tbody>
          </table>
        </div>
      </div>
      <div>
        <div class="sub-hd">Device Split</div>
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>Device</th><th class="r">Clicks</th><th class="r">Δ</th><th class="r">CTR</th><th class="r">Position</th></tr></thead>
            <tbody>${deviceRows}</tbody>
          </table>
        </div>
        <div class="chart-wrap mt12">
          <div class="chart-title">Device Share of Clicks</div>
          <canvas id="deviceChart"></canvas>
        </div>
      </div>
    </div>
  </div>`;
}

// ─── 03 CORE WEB VITALS ───────────────────────────────────────────
function cwvCard(metric, data) {
  const labels = { lcp:'LCP — Largest Contentful Paint', inp:'INP — Interaction to Next Paint', cls:'CLS — Cumulative Layout Shift' };
  const goodPct = data.good||0, needsPct = data.needs||0, poorPct = data.poor||0;
  return `
  <div class="cwv-card">
    <div class="cwv-metric">${labels[metric]||metric.toUpperCase()}</div>
    <div class="cwv-val ${data.status}">${data.label}</div>
    <span class="badge b-${data.status==='poor'?'poor':data.status==='needs'?'needs':'good'}">${data.status.toUpperCase()}</span>
    <div style="font-size:12px;color:var(--muted);margin-top:6px">${fmt(data.urls)} URLs affected</div>
    <div class="dist-bar">
      <div class="dg" style="width:${goodPct}%"></div>
      <div class="dn" style="width:${needsPct}%"></div>
      <div class="dp" style="width:${poorPct}%"></div>
    </div>
    <div class="dist-leg">
      <span class="lg">Good ${goodPct}%</span>
      <span class="ln">Needs ${needsPct}%</span>
      <span class="lp">Poor ${poorPct}%</span>
    </div>
    <div class="cwv-note">Target: ${data.target}</div>
  </div>`;
}

function renderCWV(d) {
  const mob = d.cwv.mobile, desk = d.cwv.desktop;
  const fixRows = [
    { p:'urgent', issue:'Mobile LCP >4s (261 URLs)',        impact:'CWV fail = ranking penalty on mobile. 63% of clicks are mobile.',       fix:'WebP hero images, preload hints, defer non-critical CSS/JS, browser caching.' },
    { p:'urgent', issue:'Mobile INP >200ms (261 URLs)',     impact:'Interaction delay on mobile hurts UX and CWV score.',                   fix:'Defer non-critical JS, reduce main-thread blocking, audit third-party scripts.' },
    { p:'high',   issue:'Desktop LCP 2.5–4s (261 URLs)',   impact:'All desktop URLs in "Needs Improvement" band; zero good-LCP URLs.',     fix:'CDN edge caching, reduce TTFB, same image optimisations as mobile.' },
    { p:'medium', issue:'CLS >0.1–0.25 (8 URLs, both)',    impact:'Layout shift on small set of pages; reduces trust.',                    fix:'Set explicit width/height on images & embeds; audit font fallbacks.' }
  ].map(r => `<tr class="${PRIORITY_ROW[r.p]}">
    <td><span class="pill ${PRIORITY_CLASS[r.p]}">${r.p.charAt(0).toUpperCase()+r.p.slice(1)}</span></td>
    <td>${r.issue}</td><td>${r.impact}</td><td>${r.fix}</td>
  </tr>`).join('');

  return `
  <div class="sec" id="cwv">
    <div class="sec-hd">
      <span class="sec-num">03</span>
      <span class="sec-title">Core Web Vitals</span>
      <span class="sec-sub">PageSpeed Insights field data</span>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab-group="cwv" data-tab-target="mobile">📱 Mobile</button>
      <button class="tab-btn"        data-tab-group="cwv" data-tab-target="desktop">🖥 Desktop</button>
    </div>
    <div data-tab-pane="cwv" data-tab-id="mobile" class="tab-pane active">
      <div class="cwv-grid">
        ${cwvCard('lcp', mob.lcp)}${cwvCard('inp', mob.inp)}${cwvCard('cls', mob.cls)}
      </div>
    </div>
    <div data-tab-pane="cwv" data-tab-id="desktop" class="tab-pane">
      <div class="cwv-grid">
        ${cwvCard('lcp', desk.lcp)}${cwvCard('inp', desk.inp)}${cwvCard('cls', desk.cls)}
      </div>
    </div>
    <div class="sub-hd">Mobile vs Desktop Comparison</div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Metric</th><th>Mobile Status</th><th class="r">Mobile URLs</th><th>Desktop Status</th><th class="r">Desktop URLs</th><th>Priority</th></tr></thead>
        <tbody>
          ${['lcp','inp','cls'].map(m => `<tr>
            <td><strong>${m.toUpperCase()}</strong></td>
            <td><span class="badge b-${mob[m].status==='poor'?'poor':mob[m].status==='needs'?'needs':'good'}">${mob[m].status.toUpperCase()} (${mob[m].label})</span></td>
            <td class="r">${fmt(mob[m].urls)}</td>
            <td><span class="badge b-${desk[m].status==='poor'?'poor':desk[m].status==='needs'?'needs':'good'}">${desk[m].status.toUpperCase()} (${desk[m].label})</span></td>
            <td class="r">${fmt(desk[m].urls)}</td>
            <td>${m==='lcp'?'<span class="pill p-urgent">Urgent</span>':m==='inp'?'<span class="pill p-high">High (Mobile)</span>':'<span class="pill p-medium">Medium</span>'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="sub-hd">Fix Priorities</div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Priority</th><th>Issue</th><th>Impact</th><th>Fix</th></tr></thead>
        <tbody>${fixRows}</tbody>
      </table>
    </div>
  </div>`;
}

// ─── 04 COVERAGE ──────────────────────────────────────────────────
function renderCoverage(d) {
  const cov = d.coverage;
  const issueRows = cov.issues.map(i => {
    const dd = i.current - i.previous;
    const isGood = dd < 0;
    const cls = dd === 0 ? 'td-fl' : isGood ? 'td-up' : 'td-dn';
    const pctChg = i.previous ? ((dd/Math.abs(i.previous))*100).toFixed(1) : '—';
    return `<tr>
      <td>${i.reason}</td>
      <td>${i.source}</td>
      <td class="r">${fmt(i.current)}</td>
      <td class="r">${fmt(i.previous)}</td>
      <td class="r"><span class="${cls}">${(dd>0?'+':'')+dd} (${(dd>0?'+':'')+pctChg}%)</span></td>
    </tr>`;
  }).join('');

  const richRows = cov.richResults.map(r => {
    const growth = r.validPrevious > 0
      ? (((r.validCurrent - r.validPrevious)/r.validPrevious)*100).toFixed(0)+'%'
      : 'New';
    return `<tr>
      <td><strong>${r.type}</strong></td>
      <td class="r">${fmt(r.validCurrent)}</td>
      <td class="r">${fmt(r.validPrevious)}</td>
      <td class="r td-up">+${growth}</td>
      <td>${r.issues}</td>
      <td><span class="badge b-${r.status}">${r.status.toUpperCase()}</span></td>
    </tr>`;
  }).join('');

  return `
  <div class="sec" id="coverage">
    <div class="sec-hd">
      <span class="sec-num">04</span>
      <span class="sec-title">Coverage</span>
      <span class="sec-sub">Indexing status · Not-indexed trend · Rich results</span>
    </div>
    <div class="sub-hd">Issues Month-over-Month</div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Reason</th><th>Source</th><th class="r">Current</th><th class="r">Previous</th><th class="r">Change</th></tr></thead>
        <tbody>${issueRows}</tbody>
      </table>
    </div>
    <div class="chart-wrap mt12">
      <div class="chart-title">Not-Indexed Page Trend</div>
      <canvas id="coverageChart"></canvas>
    </div>
    <div class="sub-hd">Rich Results Status</div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Type</th><th class="r">Valid (Current)</th><th class="r">Valid (Prior)</th><th class="r">Growth</th><th>Issues</th><th>Status</th></tr></thead>
        <tbody>${richRows}</tbody>
      </table>
    </div>
    <div class="chart-wrap mt12">
      <div class="chart-title">Rich Results Growth — FAQ &amp; Breadcrumbs</div>
      <canvas id="richResultsChart"></canvas>
    </div>
  </div>`;
}

// ─── 05 OPPORTUNITIES ─────────────────────────────────────────────
function renderOpportunities(d) {
  const rows = d.opportunities.map(o => `<tr>
    <td class="url-cell" title="${o.page}">${o.page}</td>
    <td class="r">${fmt(o.impressions)}</td>
    <td class="r">${fmt(o.clicks)}</td>
    <td class="r td-dn">${pct(o.ctr)}</td>
    <td class="r">${pos(o.position)}</td>
    <td style="font-size:12px">${o.opportunity}</td>
  </tr>`).join('');

  return `
  <div class="sec" id="opportunities">
    <div class="sec-hd">
      <span class="sec-num">05</span>
      <span class="sec-title">Content Opportunities</span>
      <span class="sec-sub">High impression / low CTR — quick wins from title &amp; meta optimisation</span>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Page</th><th class="r">Impressions</th><th class="r">Clicks</th><th class="r">CTR</th><th class="r">Position</th><th>Opportunity</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

// ─── 06 ACTIONS ───────────────────────────────────────────────────
function renderActions(d) {
  const rows = d.actions.map(a => `
  <tr class="${PRIORITY_ROW[a.priority]}">
    <td><span class="pill ${PRIORITY_CLASS[a.priority]}">${a.priority.charAt(0).toUpperCase()+a.priority.slice(1)}</span></td>
    <td><strong>${a.action}</strong><br><span style="font-size:12px;color:var(--muted)">${a.detail}</span></td>
    <td>${a.effort}</td>
    <td style="font-size:12px">${a.impact}</td>
    <td>${a.owner}</td>
    <td style="white-space:nowrap">${a.deadline}</td>
  </tr>`).join('');

  return `
  <div class="sec" id="actions">
    <div class="sec-hd">
      <span class="sec-num">06</span>
      <span class="sec-title">Recommended Actions</span>
      <span class="sec-sub">Prioritised by impact &amp; effort</span>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Priority</th><th>Action</th><th>Effort</th><th>Expected Impact</th><th>Owner</th><th>Deadline</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

// ─── CHARTS ───────────────────────────────────────────────────────
Chart.defaults.font.family = "system-ui,-apple-system,'Inter',sans-serif";
Chart.defaults.font.size = 12;
Chart.defaults.color = '#666';

function buildDeviceChart(d) {
  const el = document.getElementById('deviceChart');
  if (!el) return;
  charts.device = new Chart(el, {
    type: 'doughnut',
    data: {
      labels: d.devices.map(dv=>dv.device),
      datasets: [{ data: d.devices.map(dv=>dv.clicks), backgroundColor:['#B22333','#B26D23','#1E6E3E'], borderWidth:2, borderColor:'#fff' }]
    },
    options: {
      plugins: {
        legend: { position:'bottom', labels:{ padding:14, usePointStyle:true } },
        tooltip: { callbacks: { label: ctx => {
          const total = ctx.dataset.data.reduce((a,b)=>a+b,0);
          return ` ${ctx.label}: ${ctx.raw.toLocaleString()} (${(ctx.raw/total*100).toFixed(1)}%)`;
        }}}
      }, cutout:'60%'
    }
  });
}

function buildCoverageChart(d) {
  const el = document.getElementById('coverageChart');
  if (!el) return;
  const trend = d.coverage.notIndexedTrend;
  charts.coverage = new Chart(el, {
    type: 'bar',
    data: {
      labels: trend.map(t=>t.date),
      datasets: [{
        label: 'Not Indexed Pages',
        data: trend.map(t=>t.value),
        backgroundColor: trend.map((_,i) => {
          const pct = i/(trend.length-1);
          return `rgba(${Math.round(178-pct*100)},${Math.round(35+pct*75)},51,0.85)`;
        }),
        borderRadius: 4
      }]
    },
    options: {
      plugins: { legend:{display:false}, tooltip:{callbacks:{label:ctx=>` ${ctx.raw.toLocaleString()} not-indexed pages`}} },
      scales: {
        y: { beginAtZero:false, ticks:{callback:v=>v.toLocaleString()}, grid:{color:'#EEE'} },
        x: { grid:{display:false} }
      }
    }
  });
}

function buildRichResultsChart(d) {
  const el = document.getElementById('richResultsChart');
  if (!el) return;
  const tr = d.coverage.richResultsTrend;
  charts.richResults = new Chart(el, {
    type: 'line',
    data: {
      labels: tr.labels,
      datasets: [
        { label:'FAQ Valid', data:tr.faq, borderColor:'#B22333', backgroundColor:'rgba(178,35,51,0.07)', tension:0.3, fill:true, pointRadius:3 },
        { label:'Breadcrumbs Valid', data:tr.breadcrumbs, borderColor:'#B26D23', backgroundColor:'rgba(178,109,35,0.07)', tension:0.3, fill:true, pointRadius:3 }
      ]
    },
    options: {
      plugins: { legend:{ position:'bottom', labels:{ padding:14, usePointStyle:true } } },
      scales: {
        y: { beginAtZero:true, grid:{color:'#EEE'}, ticks:{stepSize:5} },
        x: { grid:{display:false} }
      }
    }
  });
}

// ─── BOOT ─────────────────────────────────────────────────────────
boot();
</script>
</body>
