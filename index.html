<!DOCTYPE html>
<html lang="en" data-broker="ANZO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anzo Capital — SEO Reports</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --red:#BE1A2C; --red-light:#fbeaec;
  --amber:#B26D23; --amber-light:#F5E9D8;
  --green:#1E6E3E; --green-light:#E8F5EE;
  --alt:#F4F4F4; --border:#DEDEDE;
  --text:#1A1A1A; --muted:#666;
  --bg:#F2F3F5; --white:#fff;
  --nav-h:52px;
  --filter-h:52px;
  --font:'Plus Jakarta Sans',system-ui,sans-serif;
  --primary:#BE1A2C; --primary-light:#fbeaec;
}
/* ANZO theme */
html[data-broker="ANZO"], html:not([data-broker]) {
  --font:'Plus Jakarta Sans',system-ui,sans-serif;
  --primary:#BE1A2C; --primary-light:#fbeaec;
}
/* DLSM theme */
html[data-broker="DLSM"] {
  --font:'Open Sans',system-ui,sans-serif;
  --primary:#1253a4; --primary-light:#e5eef9;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:116px}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.65}

/* ── NAV ── */
nav{background:var(--white);border-bottom:1px solid var(--border);padding:0 24px;position:sticky;top:0;z-index:200;display:flex;align-items:center;height:var(--nav-h)}
.nav-brand{font-weight:900;font-size:17px;color:var(--primary);margin-right:20px;white-space:nowrap;letter-spacing:-.4px;flex-shrink:0}
.nav-brand span{color:var(--text);font-weight:400}
.nav-links{display:flex;align-items:center;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
nav a.nav-link{color:var(--muted);text-decoration:none;padding:0 12px;font-size:13px;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;height:var(--nav-h);display:flex;align-items:center;transition:.15s;flex-shrink:0}
nav a.nav-link:hover{color:var(--primary);border-bottom-color:var(--primary)}

/* ── FILTER BAR ── */
.filter-bar{background:var(--white);border-bottom:1px solid var(--border);padding:8px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:var(--nav-h);z-index:190;min-height:var(--filter-h)}
.filter-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.filter-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);white-space:nowrap}
.chip-row{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:5px 13px;border-radius:20px;border:1.5px solid var(--border);background:var(--white);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;min-height:32px;display:flex;align-items:center}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.filter-divider{width:1px;height:22px;background:var(--border);flex-shrink:0}

/* ── REPORT PICKER ── */
#report-picker{max-width:900px;margin:32px auto;padding:0 20px}
.picker-heading{font-size:22px;font-weight:800;margin-bottom:4px}
.picker-sub{font-size:14px;color:var(--muted);margin-bottom:16px}
.picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.picker-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:18px 20px;cursor:pointer;transition:.15s;border-top:3px solid var(--border)}
.picker-card:hover{border-top-color:var(--primary);box-shadow:0 3px 12px rgba(0,0,0,.09);transform:translateY(-1px)}
.picker-card-type{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:4px}
.picker-card-label{font-size:17px;font-weight:800}
.picker-card-meta{font-size:12px;color:var(--muted);margin-top:3px}
.no-reports{text-align:center;padding:60px 20px;color:var(--muted);font-size:15px}

/* ── PAGE ── */
#report-view{display:none}
.page{max-width:1160px;margin:0 auto;padding:24px 20px 72px}

/* ── REPORT HEADER ── */
.report-header{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:22px 26px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.rh-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:5px}
.rh-title{font-size:26px;font-weight:900;line-height:1.2} .rh-title span{color:var(--primary)}
.rh-meta{font-size:13px;color:var(--muted);margin-top:4px}
.rh-badge{display:inline-flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.badge-pill{padding:4px 11px;border-radius:12px;font-size:12px;font-weight:700}
.bp-type-monthly{background:#EBF0FF;color:#2255CC}
.bp-type-weekly{background:#E8F5EE;color:var(--green)}
.bp-type-quarterly{background:var(--amber-light);color:var(--amber)}
.bp-type-yearly{background:var(--primary-light);color:var(--primary)}
.rh-logo{font-size:36px;font-weight:900;color:var(--primary);letter-spacing:-3px;white-space:nowrap;flex-shrink:0}
.rh-logo span{color:var(--amber)}

/* ── SECTION ── */
.sec{margin-top:36px}
.sec-hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sec-num{font-size:12px;font-weight:800;color:var(--primary);background:var(--primary-light);padding:3px 9px;border-radius:5px;letter-spacing:.5px;flex-shrink:0}
.sec-title{font-size:26px;font-weight:800;line-height:1.2}
.sec-sub{color:var(--muted);font-size:13px;margin-left:2px}
.sub-hd{font-size:20px;font-weight:700;margin:20px 0 10px;color:var(--text)}
.sub-sub{font-size:13px;color:var(--muted);margin-bottom:10px;margin-top:-6px}

/* ── KPI CARDS ── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:18px 20px;border-top:3px solid var(--primary)}
.card-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:5px}
.card-value{font-size:32px;font-weight:800;color:var(--primary);line-height:1.1}
.card-delta{font-size:13px;margin-top:5px;font-weight:600}
.card-sub{font-size:12px;color:var(--muted);margin-top:2px}
.up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--muted)}

/* ── DUAL CARDS (branded / non-branded) ── */
.dual-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.dual-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px 20px}
.dual-card.branded{border-top:3px solid var(--primary)} .dual-card.nonbranded{border-top:3px solid var(--amber)}
.dual-card h3{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.dual-card.branded h3{color:var(--primary)} .dual-card.nonbranded h3{color:var(--amber)}
.dual-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);font-size:14px}
.dual-row:last-child{border-bottom:none} .dual-val{font-weight:700}

/* ── TREND SECTION (branded/non-branded keywords) ── */
.trend-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.trend-card{background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.trend-card-header{padding:12px 16px 10px;border-bottom:1px solid var(--border)}
.trend-card-header h4{font-size:17px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.trend-card-header.branded-hdr h4{color:var(--primary)}
.trend-card-header.nonbranded-hdr h4{color:var(--amber)}
.trend-card-header p{font-size:12px;color:var(--muted);margin-top:2px}
.trend-tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:700;margin-left:6px}
.tag-up{background:var(--green-light);color:var(--green)}
.tag-dn{background:var(--red-light);color:var(--red)}
.tag-fl{background:var(--alt);color:var(--muted)}

/* ── WINS / CONCERNS ── */
.wc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.wc-box{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px 20px}
.wc-box.wins{border-top:3px solid var(--green)} .wc-box.concerns{border-top:3px solid var(--red)}
.wc-box h3{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.wc-box.wins h3{color:var(--green)} .wc-box.concerns h3{color:var(--red)}
.wc-box ul{padding-left:17px} .wc-box li{font-size:14px;margin-bottom:6px;line-height:1.55}

/* ── TABLES ── */
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--border)}
.tbl-scroll table{min-width:500px}
.tbl-wrap{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--white)}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--white)}
thead th{background:var(--primary);color:#fff;padding:10px 12px;text-align:left;font-weight:700;font-size:12px;white-space:nowrap}
th.r,td.r{text-align:right}
tbody tr:nth-child(even){background:var(--alt)}
tbody tr:hover{background:#EEF2FF}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:13px}
tbody tr:last-child td{border-bottom:none}
td.url-cell{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-family:monospace}
.td-up{color:var(--green);font-weight:700} .td-dn{color:var(--red);font-weight:700} .td-fl{color:var(--muted)}
tr.p1 td:first-child{border-left:3px solid #C0392B}
tr.p2 td:first-child{border-left:3px solid var(--amber)}
tr.p3 td:first-child{border-left:3px solid #2980B9}

/* ── BADGES & PILLS ── */
.badge{display:inline-block;padding:3px 9px;border-radius:5px;font-size:12px;font-weight:700}
.b-poor{background:#FDECEC;color:#C0392B} .b-needs{background:var(--amber-light);color:var(--amber)} .b-good{background:var(--green-light);color:var(--green)}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700}
.p-urgent{background:#FDECEC;color:#C0392B} .p-high{background:var(--red-light);color:var(--red)} .p-medium{background:var(--amber-light);color:var(--amber)} .p-low{background:var(--green-light);color:var(--green)}

/* ── TABS ── */
.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{padding:9px 18px;background:none;border:none;cursor:pointer;font-size:14px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:.15s;white-space:nowrap;flex-shrink:0}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab-pane{display:none} .tab-pane.active{display:block}

/* ── CWV ── */
.cwv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.cwv-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.cwv-metric{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px}
.cwv-val{font-size:26px;font-weight:800;margin-bottom:4px}
.cwv-val.poor{color:#C0392B} .cwv-val.needs{color:var(--amber)} .cwv-val.good{color:var(--green)}
.dist-bar{height:10px;border-radius:5px;display:flex;overflow:hidden;margin-top:10px}
.dg{background:#27AE60} .dn{background:#F39C12} .dp{background:#C0392B}
.dist-leg{display:flex;gap:10px;margin-top:6px;font-size:11px;color:var(--muted)}
.dist-leg .lg{color:#27AE60} .dist-leg .ln{color:#F39C12} .dist-leg .lp{color:#C0392B}
.cwv-note{font-size:12px;color:var(--muted);margin-top:8px}

/* ── CHARTS ── */
.chart-wrap{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:20px;margin-top:14px}
.chart-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px}
canvas{max-height:260px;max-width:100%}
.row-2>*{min-width:0}
.trend-grid>*{min-width:0}

/* ── BRANDED CHART LEGEND ── */
.branded-legend{display:flex;justify-content:center;gap:16px;margin-top:12px;flex-wrap:wrap}
.bl-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap}
.bl-swatch{width:14px;height:14px;border-radius:3px;flex-shrink:0;border:1px solid rgba(0,0,0,.08)}

/* ── KEYWORD PILLS ── */
.kw-pills-wrap{margin:10px 0 4px}
.kw-pill-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:7px}
.kw-pill{padding:5px 13px;border-radius:20px;font-size:13px;font-weight:600;color:#fff;white-space:nowrap;letter-spacing:.01em}
.kw-pill-red{background:var(--primary)}
.kw-pill-amber{background:var(--amber)}

/* ── COUNTRY GLOBES ── */
.globe-pair{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:14px 0}
.globe-pair>*{min-width:0}
.globe-item{text-align:center;background:var(--white);border:1px solid var(--border);border-radius:12px;padding:18px 14px 14px}
.globe-region-label{font-size:18px;font-weight:800;color:var(--text);margin-bottom:4px}
.globe-sub-label{font-size:12px;color:var(--muted);margin-bottom:10px}
.globe-item canvas{display:block;margin:0 auto;box-shadow:0 6px 28px rgba(0,0,0,.18);max-width:100%;height:auto}
.globe-legend-bar{display:flex;justify-content:center;gap:18px;margin-top:10px;flex-wrap:wrap}
.gl-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.gl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
@media(max-width:640px){.globe-pair{grid-template-columns:1fr}.globe-region-label{font-size:16px}}

/* ── LAYOUT ── */
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.mt14{margin-top:14px} .mt20{margin-top:20px}

/* ── FOOTER ── */
.report-footer{margin-top:40px;padding:16px;background:var(--white);border:1px solid var(--border);border-radius:12px;font-size:13px;color:var(--muted);text-align:center}

/* ── RESPONSIVE ── */
@media(max-width:960px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .cwv-grid{grid-template-columns:repeat(2,1fr)}
  .trend-grid{grid-template-columns:1fr}
  .row-2{grid-template-columns:1fr}
  .rh-logo{display:none}
}
@media(max-width:640px){
  :root{--nav-h:48px;--filter-h:auto;scroll-padding-top:104px}
  body{font-size:14px}
  .kpi-grid{grid-template-columns:1fr 1fr;gap:10px}
  .card-value{font-size:26px}
  .dual-grid,.wc-grid{grid-template-columns:1fr}
  .sec-title{font-size:22px}
  .sub-hd{font-size:17px}
  .rh-title{font-size:20px}
  .filter-bar{padding:8px 14px;gap:8px;top:var(--nav-h)}
  .filter-divider{display:none}
  .filter-group{gap:4px}
  .page{padding:16px 14px 60px}
  nav{padding:0 14px}
  .report-header{padding:16px 18px}
  .tbl-scroll,.tbl-wrap{border-radius:8px}
  .cwv-grid{grid-template-columns:1fr}
  .chart-wrap{padding:14px}
  .sub-hd{font-size:15px}
}
@media(max-width:420px){
  .kpi-grid{grid-template-columns:1fr}
  .card-value{font-size:28px}
}

/* ── SPLIT BAR ── */
.split-section{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:20px 24px;margin-bottom:14px}
.split-lbl-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.split-lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.split-alert{font-size:11px;font-weight:700;background:var(--amber-light);color:var(--amber);padding:3px 10px;border-radius:20px;white-space:nowrap}
.split-bar-wrap{height:26px;border-radius:13px;overflow:hidden;display:flex}
.split-bar-b{background:var(--primary);display:flex;align-items:center;justify-content:flex-end;padding-right:10px}
.split-bar-nb{background:var(--amber);display:flex;align-items:center;padding-left:10px}
.split-bar-label{font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
.split-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.split-col{padding:12px 16px;border-radius:10px}
.split-col.branded{background:var(--primary-light);border-left:3px solid var(--primary)}
.split-col.nonbranded{background:var(--amber-light);border-left:3px solid var(--amber)}
.sc-head{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.sc-head.b{color:var(--primary)} .sc-head.nb{color:var(--amber)}
.sc-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.sc-val{font-weight:700}
.trend-arrow{font-size:11px;font-weight:600;margin-left:3px}

/* ── QUERY HEALTH ── */
.health-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.h-good{background:var(--green)} .h-warn{background:var(--amber)} .h-bad{background:var(--red)}
.q-tag{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700;margin-left:5px}
.tag-new{background:var(--green-light);color:var(--green)} .tag-drop{background:var(--red-light);color:var(--red)}
.pos-up{color:var(--green);font-weight:600;font-size:12px} .pos-dn{color:var(--red);font-weight:600;font-size:12px}
.health-badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.hb-good{background:var(--green-light);color:var(--green)}
.hb-warn{background:var(--amber-light);color:var(--amber)}
.hb-bad{background:var(--red-light);color:var(--red)}
.hb-new{background:#EBF0FF;color:#2255CC}

/* ── REVIEW + OPPORTUNITY ── */
.two-col{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
.review-box{background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden;border-top:3px solid var(--red)}
.review-header{padding:14px 18px 10px;border-bottom:1px solid var(--border)}
.review-title{font-size:14px;font-weight:800;color:var(--red)}
.review-sub{font-size:11px;color:var(--muted);margin-top:2px}
.opp-box{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.opp-title{font-size:14px;font-weight:800;margin-bottom:2px}
.opp-metric{background:var(--bg);border-radius:10px;padding:12px 14px}
.opp-big{font-size:22px;font-weight:800;color:var(--amber)}
.opp-desc{font-size:12px;color:var(--muted);margin-top:2px}
.opp-goal{font-size:12px;color:var(--green);font-weight:600;margin-top:4px}

/* ── CONTENT TOPICS ── */
.topic-row{display:flex;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);gap:12px}
.topic-row:last-child{border-bottom:none}
.topic-name{font-size:13px;font-weight:600;min-width:190px}
.topic-bar-wrap{flex:1;height:8px;background:var(--alt);border-radius:4px;overflow:hidden}
.topic-bar{height:8px;border-radius:4px;background:var(--amber)}
.topic-stat{font-size:13px;font-weight:700;min-width:60px;text-align:right}
.topic-impr-num{font-size:12px;color:var(--muted);min-width:80px;text-align:right}
.topic-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
.t-drop{background:var(--red-light);color:var(--red)} .t-stable{background:var(--green-light);color:var(--green)} .t-new{background:#EBF0FF;color:#2255CC}
@media(max-width:640px){.split-cols{grid-template-columns:1fr}.two-col{grid-template-columns:1fr}.topic-name{min-width:120px}}

/* ── BROKER SWITCHER ── */
.broker-btn{padding:5px 14px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;transition:.15s;font-family:inherit;letter-spacing:.3px}
.broker-btn:hover{border-color:var(--primary);color:var(--primary)}
.broker-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
</style>
</head>
<body>

<!-- ─── NAV ─────────────────────────────────────────────────────── -->
<nav>
  <div class="nav-brand" onclick="showPicker()" style="cursor:pointer">SEO Reports</div>
  <div class="nav-links">
    <a href="#exec"          class="nav-link">Summary</a>
    <a href="#performance"   class="nav-link">Performance</a>
    <a href="#cwv"           class="nav-link">Core Web Vitals</a>
    <a href="#coverage"      class="nav-link">Coverage</a>
    <a href="#opportunities" class="nav-link">Opportunities</a>
    <a href="#actions"       class="nav-link">Actions</a>
  </div>
  <div class="broker-switcher" style="margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0;padding-left:16px">
    <button class="broker-btn active" data-broker="ANZO" onclick="setBroker('ANZO')">ANZO</button>
    <button class="broker-btn" data-broker="DLSM" onclick="setBroker('DLSM')">DLSM</button>
  </div>
</nav>

<!-- ─── FILTER BAR ──────────────────────────────────────────────── -->
<div class="filter-bar">
  <div class="filter-group">
    <span class="filter-label">Type</span>
    <div class="chip-row" id="type-chips"></div>
  </div>
  <div class="filter-divider"></div>
  <div class="filter-group">
    <span class="filter-label">Year</span>
    <div class="chip-row" id="year-chips"></div>
  </div>
  <div class="filter-divider"></div>
  <div class="filter-group">
    <span class="filter-label">Period</span>
    <div class="chip-row" id="period-chips"></div>
  </div>
</div>

<!-- ─── REPORT PICKER ───────────────────────────────────────────── -->
<div id="report-picker">
  <div class="picker-heading">Available Reports</div>
  <div class="picker-sub">Select a report below, or use the filters above.</div>
  <div class="picker-grid" id="picker-grid"></div>
</div>

<!-- ─── REPORT VIEW ─────────────────────────────────────────────── -->
<div id="report-view">
  <div class="page" id="report-page"></div>
</div>

<script>
// ─── NAVIGATION ───────────────────────────────────────────────────
function showPicker() {
  document.getElementById('report-view').style.display = 'none';
  document.getElementById('report-picker').style.display = '';
  history.pushState(null, '', location.pathname);
}

// ─── BROKER ───────────────────────────────────────────────────────
function setBroker(broker) {
  document.documentElement.setAttribute('data-broker', broker);
  document.querySelectorAll('.broker-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.broker === broker);
  });
}

// ─── STATE ────────────────────────────────────────────────────────
let manifest = null, currentReport = null, charts = {};
let activeType = 'all', activeYear = 'all';

const TYPE_LABELS = { all:'All', weekly:'Weekly', monthly:'Monthly', quarterly:'Quarterly', yearly:'Yearly' };
const MONTH_NAMES = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const PRIORITY_CLASS = { urgent:'p-urgent', high:'p-high', medium:'p-medium', low:'p-low' };
const PRIORITY_ROW   = { urgent:'p1', high:'p1', medium:'p2', low:'p3' };
const BRANDED_TERMS  = ['anzo','anzocapital','昂首资本'];
const isBranded = q => BRANDED_TERMS.some(t => q.toLowerCase().includes(t));

// ─── BOOT ─────────────────────────────────────────────────────────
async function boot() {
  try {
    const res = await fetch('reports/manifest.json', {cache:'no-cache'});
    manifest = await res.json();
  } catch(e) {
    document.getElementById('report-picker').innerHTML =
      '<div class="no-reports">Could not load manifest.json.</div>'; return;
  }
  buildFilters();
  buildPickerGrid(manifest.reports);
  const hash = location.hash.replace('#','');
  const target = hash ? manifest.reports.find(r=>r.id===hash) : manifest.reports[manifest.reports.length-1];
  if (target) loadReport(target.id);
}

// ─── FILTERS ──────────────────────────────────────────────────────
function buildFilters() {
  const reports = manifest.reports;
  const types = ['all', ...new Set(reports.map(r=>r.type))];
  document.getElementById('type-chips').innerHTML = types.map(t =>
    `<button class="chip ${t===activeType?'active':''}" onclick="setType('${t}')">${TYPE_LABELS[t]||t}</button>`
  ).join('');
  const years = ['all', ...new Set(reports.map(r=>r.year))].sort((a,b)=>a==='all'?-1:b-a);
  document.getElementById('year-chips').innerHTML = years.map(y =>
    `<button class="chip ${String(y)===String(activeYear)?'active':''}" onclick="setYear('${y}')">${y==='all'?'All':y}</button>`
  ).join('');
  buildPeriodChips();
}

function buildPeriodChips() {
  const filtered = getFiltered();
  if (!filtered.length) {
    document.getElementById('period-chips').innerHTML =
      '<span style="font-size:12px;color:var(--muted)">No reports</span>'; return;
  }
  document.getElementById('period-chips').innerHTML = filtered.map(r => {
    const label = getPeriodLabel(r);
    const isActive = currentReport && currentReport.meta.id === r.id;
    return `<button class="chip ${isActive?'active':''}" onclick="loadReport('${r.id}')">${label}</button>`;
  }).join('');
}

function getPeriodLabel(r) {
  if (r.type==='monthly')   return MONTH_NAMES[r.month]||r.label;
  if (r.type==='weekly')    return `W${String(r.week).padStart(2,'0')}`;
  if (r.type==='quarterly') return `Q${r.quarter}`;
  if (r.type==='yearly')    return String(r.year);
  return r.label;
}

function setType(t){ activeType=t; buildFilters(); buildPickerGrid(getFiltered()); }
function setYear(y){ activeYear=y; buildFilters(); buildPickerGrid(getFiltered()); }
function getFiltered(){
  return manifest.reports.filter(r=>
    (activeType==='all'||r.type===activeType) &&
    (activeYear==='all'||String(r.year)===String(activeYear))
  );
}

// ─── PICKER GRID ──────────────────────────────────────────────────
function buildPickerGrid(reports) {
  const grid = document.getElementById('picker-grid');
  if (!reports.length) {
    grid.innerHTML = '<div class="no-reports" style="grid-column:1/-1">No reports match the filters.</div>'; return;
  }
  grid.innerHTML = reports.slice().reverse().map(r => `
    <div class="picker-card" onclick="loadReport('${r.id}')">
      <div class="picker-card-type">${TYPE_LABELS[r.type]||r.type}</div>
      <div class="picker-card-label">${r.label}</div>
      <div class="picker-card-meta">vs ${r.comparePeriod||'—'} · ${r.generatedAt}</div>
    </div>`).join('');
}

// ─── LOAD REPORT ──────────────────────────────────────────────────
async function loadReport(id) {
  const entry = manifest.reports.find(r=>r.id===id);
  if (!entry) return;
  let data;
  try { const res = await fetch(entry.file, {cache:'no-cache'}); data = await res.json(); }
  catch(e) { alert('Could not load: '+entry.file); return; }
  currentReport = data;
  history.replaceState(null,'','#'+id);
  destroyCharts();
  renderReport(data);
  document.getElementById('report-picker').style.display = 'none';
  document.getElementById('report-view').style.display = 'block';
  buildPeriodChips();
  window.scrollTo({top:0,behavior:'smooth'});
}

function destroyCharts(){ Object.values(charts).forEach(c=>c.destroy()); charts={}; }

// ─── HELPERS ──────────────────────────────────────────────────────
const fmt  = n => n==null?'—':Number(n).toLocaleString();
const fmtK = n => n==null?'—':n>=1000?(n/1000).toFixed(1).replace(/\.0$/,'')+'K':fmt(n);
const pct  = n => n==null?'—':Number(n).toFixed(1)+'%';
const pos  = n => n==null?'—':Number(n).toFixed(1);

function delta(cur, prev, hib=true) {
  if (prev==null||prev===0) return '<span class="td-fl">—</span>';
  const d=cur-prev, p=((d/Math.abs(prev))*100).toFixed(1);
  const good = hib ? d>0 : d<0;
  const cls = d===0?'td-fl':(good?'td-up':'td-dn');
  return `<span class="${cls}">${d>0?'+':''}${fmt(d)} (${d>0?'+':''}${p}%)</span>`;
}

function deltaSimple(cur, prev, hib=true) {
  if (prev==null) return '<span class="flat">—</span>';
  const d=cur-prev;
  const good = hib ? d>0 : d<0;
  const cls = d===0?'flat':(good?'up':'down');
  const arrow = d>0?'▲ +':(d<0?'▼ ':'― ');
  return `<span class="card-delta ${cls}">${arrow}${fmt(Math.abs(d))}</span>`;
}

function trendTag(cur, prev) {
  if (!prev||prev===0) return '<span class="trend-tag tag-fl">New</span>';
  const pct = ((cur-prev)/Math.abs(prev))*100;
  if (pct >= 5)  return `<span class="trend-tag tag-up">▲ +${pct.toFixed(0)}%</span>`;
  if (pct <= -5) return `<span class="trend-tag tag-dn">▼ ${pct.toFixed(0)}%</span>`;
  return '<span class="trend-tag tag-fl">― Stable</span>';
}

function typeClass(t){ return {monthly:'bp-type-monthly',weekly:'bp-type-weekly',quarterly:'bp-type-quarterly',yearly:'bp-type-yearly'}[t]||''; }

function boldWC(s) {
  const idx = s.indexOf(' — ');
  if (idx > -1) return `<strong>${s.slice(0,idx)}</strong>${s.slice(idx)}`;
  const idx2 = s.indexOf(': ');
  if (idx2 > -1) return `<strong>${s.slice(0,idx2)}</strong>${s.slice(idx2)}`;
  return s;
}

// ─── RENDER ───────────────────────────────────────────────────────
function renderReport(d) {
  const page = document.getElementById('report-page');
  page.innerHTML = `
    ${renderHeader(d)}
    ${renderExec(d)}
    ${renderPerformance(d)}
    ${renderCWV(d)}
    ${renderCoverage(d)}
    ${renderOpportunities(d)}
    ${renderActions(d)}
    <div class="report-footer">
      Report generated ${d.meta.generatedAt} · Google Search Console ·
      Property: ${d.meta.property} · ${d.meta.searchType} search
    </div>`;
  page.querySelectorAll('[data-tab-group]').forEach(btn => {
    btn.addEventListener('click', () => {
      const g=btn.dataset.tabGroup, t=btn.dataset.tabTarget;
      document.querySelectorAll(`[data-tab-group="${g}"]`).forEach(b=>b.classList.remove('active'));
      document.querySelectorAll(`[data-tab-pane="${g}"]`).forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.querySelector(`[data-tab-pane="${g}"][data-tab-id="${t}"]`).classList.add('active');
    });
  });
  requestAnimationFrame(() => {
    buildDeviceChart(d);
    buildBrandedTrendChart(d);
    buildCoverageChart(d);
    buildRichResultsChart(d);
    buildRegionGlobe(d,'seaGlobe',
      new Set(['indonesia','malaysia','philippines','vietnam','thailand']),
      5, 112);
    buildRegionGlobe(d,'africaGlobe',
      new Set(['nigeria','kenya']),
      2, 22);
  });
}

// ─── HEADER ───────────────────────────────────────────────────────
function renderHeader(d) {
  const m = d.meta;
  return `
  <div class="report-header">
    <div>
      <div class="rh-label">SEO Performance Report</div>
      <div class="rh-title"><span>Anzo Capital</span> — ${m.period}</div>
      <div class="rh-meta">${m.dateStart} → ${m.dateEnd} · Compared to: ${m.comparePeriod}</div>
      <div class="rh-badge">
        <span class="badge-pill ${typeClass(m.type)}">${TYPE_LABELS[m.type]||m.type}</span>
        <span class="badge-pill" style="background:var(--alt);color:var(--muted)">${m.searchType}</span>
        <span class="badge-pill" style="background:var(--alt);color:var(--muted)">Generated ${m.generatedAt}</span>
      </div>
    </div>
  </div>`;
}

// ─── 01 EXECUTIVE SUMMARY ─────────────────────────────────────────
function renderExec(d) {
  const k=d.kpis, b=d.branded, nb=d.nonBranded;

  // Split queries
  const bQueries  = d.queries.filter(q=>isBranded(q.query)).sort((a,b)=>b.clicks-a.clicks).slice(0,8);
  const nbQueries = d.queries.filter(q=>!isBranded(q.query)).sort((a,b)=>b.impressions-a.impressions).slice(0,8);
  const allNbQ    = d.queries.filter(q=>!isBranded(q.query));
  const reviewQ   = d.queries.filter(q=>isBranded(q.query) && /review|legit|scam|uy tín|terpercaya|trusted/i.test(q.query)).sort((a,b)=>b.impressions-a.impressions);

  // Health badge for branded queries
  function bHealth(q) {
    if (q.clicks===0 && q.impressions>10) return {label:'⚠ Investigate',cls:'hb-bad',dot:'h-bad'};
    if (q.clicksPrev===0 && q.clicks>0)   return {label:'Emerging',cls:'hb-new',dot:'h-good'};
    if (q.clicksPrev>0) {
      const drop=(q.clicks-q.clicksPrev)/q.clicksPrev;
      if (drop<-0.30) return {label:'⚠ Investigate',cls:'hb-bad',dot:'h-bad'};
      if (drop<-0.15) return {label:'Watch',cls:'hb-warn',dot:'h-warn'};
    }
    return {label:'Stable',cls:'hb-good',dot:'h-good'};
  }

  // Position delta HTML
  function posDelta(q) {
    if (!q.positionPrev || q.positionPrev<=0) return '<span style="color:var(--muted)">New</span>';
    const d=(q.positionPrev-q.position).toFixed(1);
    if (parseFloat(d)>0.05)  return `<span class="pos-up">▲ ${d}</span>`;
    if (parseFloat(d)<-0.05) return `<span class="pos-dn">▼ ${Math.abs(parseFloat(d).toFixed(1))}</span>`;
    return '<span style="color:var(--muted)">—</span>';
  }

  // Branded table rows
  const bRows = bQueries.map(q=>{
    const h=bHealth(q);
    const rowBg=h.cls==='hb-bad'?'background:#FFF8F8':'';
    const dropTag=q.clicksPrev>0&&(q.clicks-q.clicksPrev)/q.clicksPrev<-0.25
      ?`<span class="q-tag tag-drop">${Math.round((q.clicks-q.clicksPrev)/q.clicksPrev*100)}%</span>`:'';
    const newTag=q.clicksPrev===0&&q.clicks>0?`<span class="q-tag tag-new">New</span>`:'';
    return `<tr style="${rowBg}">
      <td><span class="health-dot ${h.dot}"></span>${q.query}${dropTag}${newTag}</td>
      <td class="r">${fmt(q.clicks)}</td>
      <td class="r">${delta(q.clicks,q.clicksPrev)}</td>
      <td class="r">${pct(q.ctr)}</td>
      <td class="r">${pos(q.position)}</td>
      <td class="r">${posDelta(q)}</td>
      <td class="r"><span class="health-badge ${h.cls}">${h.label}</span></td>
    </tr>`;
  }).join('');

  // Non-branded table rows
  const nbRows = nbQueries.map(q=>`<tr>
    <td>${q.query}</td>
    <td class="r">${fmt(q.impressions)}</td>
    <td class="r">${fmt(q.clicks)}</td>
    <td class="r">${delta(q.clicks,q.clicksPrev)}</td>
    <td class="r">${pct(q.ctr)}</td>
    <td class="r">${pos(q.position)}</td>
    <td class="r">${posDelta(q)}</td>
  </tr>`).join('');

  // Review query rows
  const reviewRows = reviewQ.length
    ? reviewQ.map(q=>{
        const gap=(q.position-5).toFixed(1);
        const gapCls=parseFloat(gap)>0?'td-dn':'td-up';
        return `<tr>
          <td>${q.query}</td>
          <td class="r">${fmt(q.impressions)}</td>
          <td class="r">${fmt(q.clicks)}</td>
          <td class="r">${pos(q.position)}</td>
          <td class="r"><span class="${gapCls}">${parseFloat(gap)>0?'+'+gap:gap} spots</span></td>
        </tr>`;
      }).join('')
    : `<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:20px 0">No review queries this period</td></tr>`;

  // Content topic clusters
  const mt5Q=allNbQ.filter(q=>/mt5|metatrader|price.?alert/i.test(q.query));
  const eduQ=allNbQ.filter(q=>/cpi|rebate|bonus|spread/i.test(q.query));
  const mt5C=mt5Q.reduce((s,q)=>s+q.clicks,0), mt5I=mt5Q.reduce((s,q)=>s+q.impressions,0);
  const eduC=eduQ.reduce((s,q)=>s+q.clicks,0),  eduI=eduQ.reduce((s,q)=>s+q.impressions,0);
  const maxI=Math.max(mt5I,eduI)||1;

  // Recoverable clicks
  const recoverableClicks=Math.max(0,Math.round(nb.impressions.current*0.03-nb.clicks.current));
  const nbNonClickRate=(100-nb.ctr).toFixed(1);

  // Share alert from history
  const hist=d.nonBrandedShareHistory||[];
  const shareAlert=hist.length>=2
    ?`<span class="split-alert">⚠ Non-branded down ${(hist[0].share-hist[hist.length-1].share).toFixed(1)} pts since ${hist[0].period}</span>`
    :'';

  return `
  <div class="sec" id="exec">
    <div class="sec-hd">
      <span class="sec-num">01</span>
      <span class="sec-title">Executive Summary</span>
      <span class="sec-sub">${d.meta.period} vs ${d.meta.comparePeriod}</span>
    </div>

    <div class="kpi-grid">
      <div class="card">
        <div class="card-label">Total Clicks</div>
        <div class="card-value">${fmtK(k.clicks.current)}</div>
        ${deltaSimple(k.clicks.current,k.clicks.previous)}
        <div class="card-sub">vs ${fmtK(k.clicks.previous)} prior period</div>
      </div>
      <div class="card">
        <div class="card-label">Total Impressions</div>
        <div class="card-value">${fmtK(k.impressions.current)}</div>
        ${deltaSimple(k.impressions.current,k.impressions.previous)}
        <div class="card-sub">vs ${fmtK(k.impressions.previous)} prior period</div>
      </div>
      <div class="card">
        <div class="card-label">Average CTR</div>
        <div class="card-value">${pct(k.ctr.current)}</div>
        ${deltaSimple(k.ctr.current,k.ctr.previous)}
        <div class="card-sub">vs ${pct(k.ctr.previous)} prior period</div>
      </div>
      <div class="card">
        <div class="card-label">Avg Position</div>
        <div class="card-value">${pos(k.position.current)}</div>
        ${deltaSimple(k.position.current,k.position.previous,false)}
        <div class="card-sub">vs ${pos(k.position.previous)} prior period</div>
      </div>
    </div>

    <!-- Split bar -->
    <div class="split-section">
      <div class="split-lbl-row">
        <span class="split-lbl">Branded vs Non-Branded Click Share · ${d.meta.period}</span>
        ${shareAlert}
      </div>
      <div class="split-bar-wrap">
        <div class="split-bar-b" style="width:${b.shareOfClicks}%">
          <span class="split-bar-label">Branded ${b.shareOfClicks}% · ${fmt(b.clicks.current)} clicks · CTR ${pct(b.ctr)}</span>
        </div>
        <div class="split-bar-nb" style="width:${nb.shareOfClicks}%">
          <span class="split-bar-label">Non-Branded ${nb.shareOfClicks}% · ${fmt(nb.clicks.current)} clicks · CTR ${pct(nb.ctr)}</span>
        </div>
      </div>
      <div class="split-cols">
        <div class="split-col branded">
          <div class="sc-head b">Branded Traffic</div>
          <div class="sc-row"><span>Clicks</span><span class="sc-val">${fmt(b.clicks.current)} <span class="trend-arrow ${b.clicks.current>=b.clicks.previous?'up':'down'}">${b.clicks.current>=b.clicks.previous?'▲':'▼'} ${Math.abs(Math.round((b.clicks.current-b.clicks.previous)/b.clicks.previous*100))}%</span></span></div>
          <div class="sc-row"><span>Impressions</span><span class="sc-val">${fmt(b.impressions.current)}</span></div>
          <div class="sc-row"><span>CTR</span><span class="sc-val">${pct(b.ctr)}</span></div>
          <div class="sc-row"><span>Share of Clicks</span><span class="sc-val">${pct(b.shareOfClicks)}</span></div>
        </div>
        <div class="split-col nonbranded">
          <div class="sc-head nb">Non-Branded Traffic</div>
          <div class="sc-row"><span>Clicks</span><span class="sc-val">${fmt(nb.clicks.current)} <span class="trend-arrow ${nb.clicks.current>=nb.clicks.previous?'up':'down'}">${nb.clicks.current>=nb.clicks.previous?'▲':'▼'} ${Math.abs(Math.round((nb.clicks.current-nb.clicks.previous)/nb.clicks.previous*100))}%</span></span></div>
          <div class="sc-row"><span>Impressions</span><span class="sc-val">${fmt(nb.impressions.current)}</span></div>
          <div class="sc-row"><span>CTR</span><span class="sc-val">${pct(nb.ctr)}</span></div>
          <div class="sc-row"><span>Share of Clicks</span><span class="sc-val">${pct(nb.shareOfClicks)}</span></div>
        </div>
      </div>
    </div>

    <!-- 6-month trend chart -->
    <div class="chart-wrap">
      <div class="chart-title">Non-Branded Click Share — ${hist.length ? hist.length+'-Month' : ''} Trend</div>
      <div style="font-size:12px;color:var(--muted);margin:-10px 0 14px">Falling trend = growing brand dependency · target 40%</div>
      <canvas id="brandedTrendChart"></canvas>
      <div class="branded-legend" style="margin-top:10px">
        <span class="bl-item"><span class="bl-swatch" style="background:var(--amber)"></span>Non-branded share (%)</span>
        <span class="bl-item"><span class="bl-swatch" style="background:var(--green);opacity:.6"></span>Target 40%</span>
      </div>
    </div>

    <!-- Branded keywords -->
    <div class="sub-hd mt20">Branded Keywords</div>
    <div class="sub-sub">Queries containing brand name · sorted by clicks · Δ Pos = position change vs prior period</div>
    <div class="tbl-scroll mt14">
      <table>
        <thead><tr><th>Keyword</th><th class="r">Clicks</th><th class="r">Δ Clicks</th><th class="r">CTR</th><th class="r">Position</th><th class="r">Δ Pos</th><th class="r">Health</th></tr></thead>
        <tbody>${bRows||'<tr><td colspan="7" style="text-align:center;color:var(--muted)">No branded queries</td></tr>'}</tbody>
      </table>
    </div>

    <!-- Non-branded keywords -->
    <div class="sub-hd mt20">Non-Branded Keywords</div>
    <div class="sub-sub">Generic / topic queries · sorted by impressions · Δ Pos = position change vs prior period</div>
    <div class="tbl-scroll mt14">
      <table>
        <thead><tr><th>Keyword</th><th class="r">Impr</th><th class="r">Clicks</th><th class="r">Δ Clicks</th><th class="r">CTR</th><th class="r">Position</th><th class="r">Δ Pos</th></tr></thead>
        <tbody>${nbRows||'<tr><td colspan="7" style="text-align:center;color:var(--muted)">No non-branded queries</td></tr>'}</tbody>
      </table>
    </div>

    <!-- Review queries + Opportunity -->
    <div class="two-col mt20">
      <div class="review-box">
        <div class="review-header">
          <div class="review-title">Review &amp; Trust Queries</div>

// ─── 02 SEARCH PERFORMANCE ────────────────────────────────────────
function renderPerformance(d) {
  const k=d.kpis;

  const queryRows = d.queries.slice(0,10).map(q => {
    const dd = q.clicksPrev!=null ? q.clicks-q.clicksPrev : null;
    const cls = dd==null?'td-fl':dd>0?'td-up':dd<0?'td-dn':'td-fl';
    const dStr = dd==null?'—':(dd>0?'+':'')+dd;
    return `<tr>
      <td>${q.query}</td>
      <td class="r">${fmt(q.clicks)}</td>
      <td class="r">${fmt(q.clicksPrev??'—')}</td>
      <td class="r"><span class="${cls}">${dStr}</span></td>
      <td class="r">${fmt(q.impressions)}</td>
      <td class="r">${pct(q.ctr)}</td>
      <td class="r">${pos(q.position)}</td>
      <td class="r">${pos(q.positionPrev)}</td>
    </tr>`;
  }).join('');

  const pageRows = d.pages.map(p => {
    const dd=p.clicks-(p.clicksPrev||0);
    const cls=dd>0?'td-up':dd<0?'td-dn':'td-fl';
    return `<tr>
      <td style="font-size:12px;font-family:monospace;word-break:break-all;line-height:1.45;min-width:180px">${p.page}</td>
      <td class="r">${fmt(p.clicks)}</td>
      <td class="r"><span class="${cls}">${(dd>0?'+':'')+dd}</span></td>
      <td class="r">${fmt(p.impressions)}</td>
      <td class="r">${pct(p.ctr)}</td>
      <td class="r">${pos(p.position)}</td>
    </tr>`;
  }).join('');

  const countryRows = d.countries.map(c => {
    const dd=c.clicks-(c.clicksPrev||0);
    const cls=dd>0?'td-up':dd<0?'td-dn':'td-fl';
    return `<tr>
      <td>${c.flag||''} ${c.country}</td>
      <td class="r">${fmt(c.clicks)}</td>
      <td class="r"><span class="${cls}">${(dd>0?'+':'')+dd}</span></td>
      <td class="r">${pct(c.ctr)}</td>
      <td class="r">${pos(c.position)}</td>
    </tr>`;
  }).join('');

  const deviceRows = d.devices.map(dv => {
    const dd=dv.clicks-(dv.clicksPrev||0);
    const cls=dd>0?'td-up':dd<0?'td-dn':'td-fl';
    return `<tr>
      <td>${dv.icon||''} ${dv.device}</td>
      <td class="r">${fmt(dv.clicks)}</td>
      <td class="r"><span class="${cls}">${(dd>0?'+':'')+dd}</span></td>
      <td class="r">${pct(dv.ctr)}</td>
      <td class="r">${pos(dv.position)}</td>
    </tr>`;
  }).join('');

  return `
  <div class="sec" id="performance">
    <div class="sec-hd">
      <span class="sec-num">02</span>
      <span class="sec-title">Search Performance</span>
      <span class="sec-sub">${d.meta.searchType} · ${d.meta.period} vs ${d.meta.comparePeriod}</span>
    </div>

    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Metric</th><th class="r">Current</th><th class="r">Previous</th><th class="r" colspan="2">Change</th></tr></thead>
        <tbody>
          <tr><td>Total Clicks</td><td class="r">${fmt(k.clicks.current)}</td><td class="r">${fmt(k.clicks.previous)}</td><td class="r" colspan="2">${delta(k.clicks.current,k.clicks.previous)}</td></tr>
          <tr><td>Total Impressions</td><td class="r">${fmt(k.impressions.current)}</td><td class="r">${fmt(k.impressions.previous)}</td><td class="r" colspan="2">${delta(k.impressions.current,k.impressions.previous)}</td></tr>

function cwvCard(metric, data) {
  const labels = { lcp:'LCP — Largest Contentful Paint', inp:'INP — Interaction to Next Paint', cls:'CLS — Cumulative Layout Shift' };
  const g=data.good||0, n=data.needs||0, p=data.poor||0;
  return `
  <div class="cwv-card">
    <div class="cwv-metric">${labels[metric]||metric.toUpperCase()}</div>
    <div class="cwv-val ${data.status}">${data.label}</div>
    <span class="badge b-${data.status==='poor'?'poor':data.status==='needs'?'needs':'good'}">${data.status.toUpperCase()}</span>
    <div style="font-size:13px;color:var(--muted);margin-top:7px">${fmt(data.urls)} URLs affected</div>

      <span class="ln">Needs ${n}%</span>
      <span class="lp">Poor ${p}%</span>

    <div class="cwv-note">Target: ${data.target}</div>
  </div>`;
}

// ─── 04 COVERAGE ──────────────────────────────────────────────────
function renderCoverage(d) {
  const cov=d.coverage;
  const issueRows = cov.issues.map(i => {
    const dd=i.current-i.previous, good=dd<0;
    const cls=dd===0?'td-fl':good?'td-up':'td-dn';
    const pctChg=i.previous?((dd/Math.abs(i.previous))*100).toFixed(1):'—';
    return `<tr>
      <td>${i.reason}</td><td>${i.source}</td>
      <td class="r">${fmt(i.current)}</td>
      <td class="r">${fmt(i.previous)}</td>
      <td class="r"><span class="${cls}">${(dd>0?'+':'')+dd} (${(dd>0?'+':'')+pctChg}%)</span></td>
    </tr>`;
  }).join('');

  const richRows = cov.richResults.map(r => {
    const growth = r.validPrevious>0?(((r.validCurrent-r.validPrevious)/r.validPrevious)*100).toFixed(0)+'%':'New';
    return `<tr>
      <td><strong>${r.type}</strong></td>
      <td class="r">${fmt(r.validCurrent)}</td>
      <td class="r">${fmt(r.validPrevious)}</td>
      <td class="r td-up">+${growth}</td>
      <td>${r.issues}</td>
      <td><span class="badge b-${r.status}">${r.status.toUpperCase()}</span></td>
    </tr>`;
  }).join('');

  return `
  <div class="sec" id="coverage">
    <div class="sec-hd">
      <span class="sec-num">04</span>
      <span class="sec-title">Coverage</span>
      <span class="sec-sub">Indexing status · Not-indexed trend · Rich results</span>
    </div>
    <div class="sub-hd">Issues vs Prior Period</div>
    <div class="tbl-scroll">
      <table>
        <thead><tr><th>Reason</th><th>Source</th><th class="r">Current</th><th class="r">Previous</th><th class="r">Change</th></tr></thead>
        <tbody>${issueRows}</tbody>
      </table>
    </div>
    <div class="chart-wrap">
      <div class="chart-title">Not-Indexed Page Trend</div>
      <canvas id="coverageChart"></canvas>
    </div>
    <div class="sub-hd">Rich Results Status</div>
    <div class="tbl-scroll">
      <table>
        <thead><tr><th>Type</th><th class="r">Valid (Current)</th><th class="r">Valid (Prior)</th><th class="r">Growth</th><th>Issues</th><th>Status</th></tr></thead>
        <tbody>${richRows}</tbody>
      </table>
    </div>
    <div class="chart-wrap">
      <div class="chart-title">Rich Results Growth — FAQ &amp; Breadcrumbs</div>
      <canvas id="richResultsChart"></canvas>
    </div>
  </div>`;
}

// ─── CHARTS ───────────────────────────────────────────────────────
Chart.defaults.font.family = "system-ui,-apple-system,'Inter',sans-serif";
Chart.defaults.font.size = 13;
Chart.defaults.color = '#555';

function buildDeviceChart(d) {
  const el = document.getElementById('deviceChart'); if(!el) return;
  charts.device = new Chart(el, {
    type:'doughnut',
    data:{
      labels: d.devices.map(dv=>dv.device),
      datasets:[{data:d.devices.map(dv=>dv.clicks),backgroundColor:['#B22333','#B26D23','#1E6E3E'],borderWidth:2,borderColor:'#fff'}]
    },
    options:{
      plugins:{
        legend:{position:'bottom',labels:{padding:16,usePointStyle:true}},
        tooltip:{callbacks:{label:ctx=>{const t=ctx.dataset.data.reduce((a,b)=>a+b,0);return ` ${ctx.label}: ${ctx.raw.toLocaleString()} (${(ctx.raw/t*100).toFixed(1)}%)`;}}}
      },cutout:'60%'
    }
  });
}

function buildBrandedTrendChart(d) {
  const el = document.getElementById('brandedTrendChart'); if(!el) return;
  const hist = d.nonBrandedShareHistory||[];
  if (hist.length) {
    charts.brandedTrend = new Chart(el, {
      type:'line',
      data:{
        labels: hist.map(h=>h.period),
        datasets:[
          {
            label:'Non-Branded Share (%)',
            data: hist.map(h=>h.share),
            borderColor:'#B26D23',
            backgroundColor:'rgba(178,109,35,.08)',
            fill:true, tension:0.3,
            pointRadius:5, pointBackgroundColor:'#B26D23',
            pointBorderColor:'#fff', pointBorderWidth:2
          },
          {
            label:'Target 40%',
            data: hist.map(()=>40),
            borderColor:'#1E6E3E', borderDash:[5,4],
            borderWidth:1.5, pointRadius:0, fill:false
          }
        ]
      },
      options:{
        plugins:{
          legend:{display:false},
          tooltip:{callbacks:{label:ctx=>` ${ctx.dataset.label}: ${ctx.raw}%`}}
        },
        scales:{
          y:{min:20,max:50,grid:{color:'#EEE'},ticks:{callback:v=>v+'%'}},
          x:{grid:{display:false}}
        }
      }
    });
  } else {
    const b=d.branded, nb=d.nonBranded;
    charts.brandedTrend = new Chart(el, {
      type:'bar',
      data:{
        labels:['Branded Clicks','Non-Branded Clicks'],
        datasets:[
          {label:'Current', data:[b.clicks.current,nb.clicks.current], backgroundColor:['rgba(190,26,44,1)','#B26D23'], borderRadius:5},
          {label:'Prior',   data:[b.clicks.previous,nb.clicks.previous], backgroundColor:['rgba(190,26,44,.3)','rgba(178,109,35,.3)'], borderRadius:5}
        ]
      },
      options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'#EEE'},ticks:{callback:v=>v.toLocaleString()}},x:{grid:{display:false}}}}
    });
  }
}

function buildRegionGlobe(d, canvasId, targetSet, clat, clon) {
  const el = document.getElementById(canvasId); if(!el) return;
  const SZ = 520;
  el.width = SZ; el.height = SZ;
  el.style.maxWidth = '100%'; el.style.height = 'auto';
  const ctx = el.getContext('2d');
  const cx = SZ/2, cy = SZ/2, R = SZ/2 - 80; // smaller globe = room for bubble overflow

  const CLa=clat*Math.PI/180, CLo=clon*Math.PI/180;
  function proj(lat,lon){
    const la=lat*Math.PI/180, lo=lon*Math.PI/180;
    const cosC=Math.sin(CLa)*Math.sin(la)+Math.cos(CLa)*Math.cos(la)*Math.cos(lo-CLo);
    return{x:cx+R*Math.cos(la)*Math.sin(lo-CLo),
           y:cy-R*(Math.cos(CLa)*Math.sin(la)-Math.sin(CLa)*Math.cos(la)*Math.cos(lo-CLo)),
           vis:cosC>0.04};
  }

  // Globe background (clipped)
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2);
  const bg=ctx.createRadialGradient(cx-R*.22,cy-R*.28,0,cx,cy,R);
  bg.addColorStop(0,'#1e4282'); bg.addColorStop(.5,'#0d2248'); bg.addColorStop(1,'#05101f');
  ctx.fillStyle=bg; ctx.fill(); ctx.clip();

  // Graticule lines
  ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=.7;
  for(let lat=-80;lat<=80;lat+=20){
    ctx.beginPath(); let f=true;
    for(let lon=-180;lon<=180;lon+=3){
      const p=proj(lat,lon); if(!p.vis){f=true;continue;}
      f?(ctx.moveTo(p.x,p.y),f=false):ctx.lineTo(p.x,p.y);
    } ctx.stroke();
  }
  for(let lon=-180;lon<180;lon+=20){
    ctx.beginPath(); let f=true;
    for(let lat=-85;lat<=85;lat+=3){
      const p=proj(lat,lon); if(!p.vis){f=true;continue;}
      f?(ctx.moveTo(p.x,p.y),f=false):ctx.lineTo(p.x,p.y);
    } ctx.stroke();
  }
  ctx.restore();

  // Border + atmosphere
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.strokeStyle='rgba(130,180,255,0.4)'; ctx.lineWidth=2.5; ctx.stroke();
  const atm=ctx.createRadialGradient(cx,cy,R*.72,cx,cy,R*1.02);
  atm.addColorStop(0,'rgba(80,140,255,0)'); atm.addColorStop(1,'rgba(80,140,255,0.22)');
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fillStyle=atm; ctx.fill();
  // Top-left specular
  const sh=ctx.createRadialGradient(cx-R*.34,cy-R*.38,0,cx,cy,R*.7);
  sh.addColorStop(0,'rgba(255,255,255,0.15)'); sh.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fillStyle=sh; ctx.fill();

  // Build lookup: country key → data entry
  const dataMap={};
  d.countries.forEach(c=>{ dataMap[(c.country||'').toLowerCase()]=c; });

  const allKeys = new Set([...Object.keys(dataMap)]);
  targetSet.forEach(k=>allKeys.add(k));

  const tot=d.countries.reduce((s,c)=>s+(c.clicks||0),0)||1;
  const maxC=Math.max(...d.countries.map(c=>c.clicks||0),1);

  // ── PASS 1: collect bubble data ──
  const bubbles=[];
  [...allKeys].forEach(key=>{
    const geo=GEO_DATA[key]; if(!geo) return;
    const p=proj(geo.la,geo.lo); if(!p.vis) return;
    const isTgt=targetSet.has(key);
    const clicks=(dataMap[key]?.clicks||0);
    const hasData=clicks>0;
    const flag=(dataMap[key]?.flag)||geo.flag||'';
    const pctVal=hasData?((clicks/tot)*100).toFixed(1):'0.0';
    const br=isTgt
      ? Math.max(52, 44+Math.sqrt(clicks/maxC)*58)
      : Math.max(16, 12+Math.sqrt(clicks/maxC)*22);
    bubbles.push({key,geo,isTgt,hasData,flag,pctVal,br,
                  x:p.x, y:p.y, ox:p.x, oy:p.y, clicks});
  });

  // ── PASS 2: collision separation (iterative force) ──
  const GAP = 6; // minimum gap between bubble edges
  for(let iter=0;iter<120;iter++){
    for(let i=0;i<bubbles.length;i++){
      for(let j=i+1;j<bubbles.length;j++){
        const a=bubbles[i], b=bubbles[j];
        const dx=b.x-a.x, dy=b.y-a.y;
        const dist=Math.sqrt(dx*dx+dy*dy)||0.001;
        const minD=a.br+b.br+GAP;
        if(dist<minD){
          const overlap=(minD-dist)/2;
          const nx=dx/dist, ny=dy/dist;
          // Heavier (larger) bubble moves less
          const wa=b.br/(a.br+b.br), wb=a.br/(a.br+b.br);
          a.x -= nx*overlap*wa;
          a.y -= ny*overlap*wa;
          b.x += nx*overlap*wb;
          b.y += ny*overlap*wb;
        }
      }
    }
  }

  // ── PASS 3: draw (smallest clicks first so big bubbles render on top) ──
  bubbles.sort((a,b)=>a.clicks-b.clicks);

  bubbles.forEach(({geo,isTgt,hasData,flag,pctVal,br,x,y,ox,oy})=>{
    // Connector line from original projection to displaced bubble
    const moved=Math.hypot(x-ox,y-oy)>br*.5;
    if(moved && isTgt){
      ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(x,y);
      ctx.strokeStyle='rgba(255,180,180,0.3)'; ctx.lineWidth=1.5;
      ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
    }

    // Glow halo
    if(isTgt){
      const gl=ctx.createRadialGradient(x,y,br*.5,x,y,br*2.2);
      gl.addColorStop(0,hasData?'rgba(178,35,51,0.28)':'rgba(178,35,51,0.12)');
      gl.addColorStop(1,'rgba(178,35,51,0)');
      ctx.beginPath(); ctx.arc(x,y,br*2.2,0,Math.PI*2); ctx.fillStyle=gl; ctx.fill();
    }

    // Bubble body
    const bub=ctx.createRadialGradient(x-br*.3,y-br*.35,0,x,y,br);
    if(isTgt){
      bub.addColorStop(0,hasData?'#e8495a':'#c04055');
      bub.addColorStop(1,hasData?'#8b1520':'#6a1020');
    } else {
      bub.addColorStop(0,'#4a6fa5'); bub.addColorStop(1,'#1e3a6e');
    }
    ctx.beginPath(); ctx.arc(x,y,br,0,Math.PI*2);
    ctx.fillStyle=bub; ctx.fill();

    // Stroke
    ctx.strokeStyle=isTgt?'rgba(255,180,180,0.65)':'rgba(120,170,255,0.4)';
    ctx.lineWidth=isTgt?2:1.5; ctx.stroke();

    if(isTgt&&!hasData){
      ctx.setLineDash([4,3]);
      ctx.strokeStyle='rgba(255,200,200,0.5)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(x,y,br,0,Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
    }

    // Inner sheen
    const sh2=ctx.createRadialGradient(x-br*.3,y-br*.38,0,x,y,br);
    sh2.addColorStop(0,'rgba(255,255,255,0.25)'); sh2.addColorStop(.4,'rgba(255,255,255,0)');
    ctx.beginPath(); ctx.arc(x,y,br,0,Math.PI*2); ctx.fillStyle=sh2; ctx.fill();

    // ── TEXT ──
    ctx.textAlign='center'; ctx.textBaseline='middle';

    if(isTgt){
      const flagSz=Math.min(34,br*.58);
      const nameSz=Math.max(13,Math.min(17,br*.30));
      const pctSz =Math.max(16,Math.min(22,br*.36));

      ctx.font=`${flagSz}px system-ui`;
      ctx.fillStyle='#fff';
      ctx.fillText(flag,x,y-br*.28);

      ctx.font=`700 ${nameSz}px system-ui,-apple-system`;
      ctx.fillStyle='rgba(255,255,255,0.95)';
      ctx.fillText(geo.name,x,y+br*.08);

      ctx.font=`900 ${pctSz}px system-ui,-apple-system`;
      ctx.fillStyle=hasData?'#fff':'rgba(255,255,255,0.5)';
      ctx.fillText(hasData?pctVal+'%':'No data',x,y+br*.42);

    } else if(br>16){
      ctx.font=`${Math.min(18,br*.65)}px system-ui`;
      ctx.fillStyle='#fff';
      ctx.fillText(flag,x,y-br*.2);
      ctx.font=`bold ${Math.max(10,br*.38)}px system-ui,-apple-system`;
      ctx.fillStyle='rgba(255,255,255,0.9)';
      ctx.fillText(pctVal+'%',x,y+br*.32);
    } else {
      ctx.font=`${Math.max(10,br*.65)}px system-ui`;
      ctx.fillStyle='rgba(255,255,255,0.85)';
      ctx.fillText(flag||pctVal+'%',x,y);
    }
  });
}

function buildCoverageChart(d) {
  const el = document.getElementById('coverageChart'); if(!el) return;
  const trend = d.coverage.notIndexedTrend;
  charts.coverage = new Chart(el, {
    type:'bar',
    data:{
      labels:trend.map(t=>t.date),
      datasets:[{
        label:'Not Indexed Pages',
        data:trend.map(t=>t.value),
        backgroundColor:trend.map((_,i)=>{const p=i/(trend.length-1);return `rgba(${Math.round(178-p*100)},${Math.round(35+p*75)},51,0.85)`;}),
        borderRadius:4
      }]
    },
    options:{
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${ctx.raw.toLocaleString()} not-indexed pages`}}},
      scales:{
        y:{beginAtZero:false,ticks:{callback:v=>v.toLocaleString()},grid:{color:'#EEE'}},
        x:{grid:{display:false}}
      }
    }
  });
}

function buildRichResultsChart(d) {
  const el = document.getElementById('richResultsChart'); if(!el) return;
  const tr=d.coverage.richResultsTrend;
  charts.richResults = new Chart(el, {
    type:'line',
    data:{
      labels:tr.labels,
      datasets:[
        {label:'FAQ Valid',data:tr.faq,borderColor:'#B22333',backgroundColor:'rgba(178,35,51,.07)',tension:.3,fill:true,pointRadius:3},
        {label:'Breadcrumbs Valid',data:tr.breadcrumbs,borderColor:'#B26D23',backgroundColor:'rgba(178,109,35,.07)',tension:.3,fill:true,pointRadius:3}

      plugins:{legend:{position:'bottom',labels:{padding:14,usePointStyle:true}}},
      scales:{y:{beginAtZero:true,grid:{color:'#EEE'},ticks:{stepSize:5}},x:{grid:{display:false}}}
    }
  });
}
